[package]
name = "rgx-desktop"
version = "0.5.0-alpha2"
description = "Native desktop interface for RGX archives"
authors = ["Rech Group"]
edition = "2021"
rust-version = "1.88"
license = "MIT"
publish = false

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["ico", "png"] }
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1.0"
rgx = { path = "../.." }
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
zeroize = "1.8"

[dev-dependencies]
tempfile = "3.12"
