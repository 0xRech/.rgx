name: Implement recipient benchmark coverage

on:
  push:
    branches: [test]

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Add RGX Recipient benchmark mode
        shell: python
        run: |
          from pathlib import Path

          bench = Path('src/benchmark.rs')
          s = bench.read_text()
          s = s.replace('use crate::{archive, private};', 'use crate::{archive, private, recipient, recipient_archive};')
          s = s.replace(
              '    pub include_private: bool,\n    pub include_7zip: bool,',
              '    pub include_private: bool,\n    pub include_recipient: bool,\n    pub include_7zip: bool,'
          )
          s = s.replace(
              '            include_private: false,\n            include_7zip: true,',
              '            include_private: false,\n            include_recipient: false,\n            include_7zip: true,'
          )
          anchor = '''    results.push(BenchmarkResult {
        name: "RGX".to_string(),
        archive_bytes: rgx_archive_bytes,
        pack_time: rgx_pack_time,
        extract_time: rgx_extract_time,
    });

'''
          insert = anchor + '''    if options.include_recipient {
        let identity = recipient::RgxPrivateKey::generate();
        let public_key = identity.public_key();
        let recipient_path = workspace.path().join("benchmark-recipient.rgx");
        let started = Instant::now();
        recipient_archive::pack_recipient(
            input,
            &recipient_path,
            options.level,
            &[public_key],
            None,
        )?;
        let recipient_pack_time = started.elapsed();
        let recipient_archive_bytes = fs::metadata(&recipient_path)?.len();

        let envelope = recipient_archive::read_envelope(&recipient_path)?;
        let slot = envelope
            .recipients
            .iter()
            .find(|slot| slot.key_id == identity.key_id())
            .ok_or_else(|| anyhow!("benchmark recipient slot is missing"))?;
        let archive_key = recipient::unwrap_archive_key_for_recipient(slot, &identity)?;

        let recipient_output = workspace.path().join("recipient-extract");
        let started = Instant::now();
        recipient_archive::extract(
            &recipient_path,
            &recipient_output,
            None,
            &archive_key,
        )?;
        let recipient_extract_time = started.elapsed();
        results.push(BenchmarkResult {
            name: "RGX Recipient".to_string(),
            archive_bytes: recipient_archive_bytes,
            pack_time: recipient_pack_time,
            extract_time: recipient_extract_time,
        });
    }

'''
          if 'name: "RGX Recipient".to_string()' not in s:
              if anchor not in s:
                  raise SystemExit('RGX benchmark anchor not found')
              s = s.replace(anchor, insert, 1)
          bench.write_text(s)

          main = Path('src/main.rs')
          s = main.read_text()
          old = '''        /// Also benchmark RGX Private Mode. A temporary internal benchmark password is used.
        #[arg(long)]
        private: bool,
        /// Do not try to benchmark an installed 7z/7zz/7za executable.
'''
          new = '''        /// Also benchmark RGX Private Mode. A temporary internal benchmark password is used.
        #[arg(long)]
        private: bool,
        /// Also benchmark native X25519 recipient protection (RGXR v2 / RGXK payload).
        #[arg(long)]
        recipient: bool,
        /// Do not try to benchmark an installed 7z/7zz/7za executable.
'''
          if old not in s and 'recipient: bool,' not in s:
              raise SystemExit('benchmark CLI field anchor not found')
          s = s.replace(old, new, 1)
          s = s.replace(
              '''        Commands::Benchmark {
            input,
            level,
            private: include_private,
            no_7zip,
        } => {
            let options = BenchmarkOptions {
                level,
                include_private,
                include_7zip: !no_7zip,
            };''',
              '''        Commands::Benchmark {
            input,
            level,
            private: include_private,
            recipient: include_recipient,
            no_7zip,
        } => {
            let options = BenchmarkOptions {
                level,
                include_private,
                include_recipient,
                include_7zip: !no_7zip,
            };''',
              1
          )
          main.write_text(s)

          test = Path('tests/benchmark.rs')
          s = test.read_text()
          s = s.replace(
              '''            level: 3,
            include_private: false,
            include_7zip: false,''',
              '''            level: 3,
            include_private: true,
            include_recipient: true,
            include_7zip: false,'''
          )
          s = s.replace('assert_eq!(report.results.len(), 2);', 'assert_eq!(report.results.len(), 4);')
          s = s.replace(
              '''    assert_eq!(report.results[0].name, "RGX");
    assert_eq!(report.results[1].name, "ZIP (Deflate)");''',
              '''    assert_eq!(report.results[0].name, "RGX");
    assert_eq!(report.results[1].name, "RGX Recipient");
    assert_eq!(report.results[2].name, "RGX Private");
    assert_eq!(report.results[3].name, "ZIP (Deflate)");'''
          )
          test.write_text(s)
      - name: Validate changes
        run: |
          cargo fmt --all
          cargo check --locked --all-features
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-features
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/benchmark.rs src/main.rs tests/benchmark.rs
          if git diff --cached --quiet; then
            echo "No implementation changes needed"
            exit 0
          fi
          git commit -m "feat: benchmark native recipient archives"
          git push origin HEAD:test
