name: Fix recipient CLI test branch

on:
  push:
    branches: [test]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply recipient native stream fixes
        shell: python
        run: |
          from pathlib import Path

          main = Path('src/main.rs')
          s = main.read_text()
          s = s.replace(
              'fallback_password.as_deref(),',
              'fallback_password.as_ref().map(|password| password.as_str()),'
          )
          main.write_text(s)

          archive = Path('src/recipient_archive.rs')
          s = archive.read_text()
          s = s.replace('&*archive_key', '&archive_key')
          s = s.replace(
              'assert_eq!(&*identity_key, password_ & *key);',
              'assert_eq!(identity_key.as_ref(), password_key.as_ref());'
          )
          archive.write_text(s)
      - name: Validate
        run: |
          cargo fmt --all
          cargo check --all-features
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-features
      - name: Commit fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.rs src/recipient_archive.rs
          git commit -m "fix: validate native recipient archive streaming"
          git push origin HEAD:test
