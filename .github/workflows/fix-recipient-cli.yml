name: Fix recipient CLI test branch

on:
  push:
    branches: [test]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply recipient native stream fixes
        shell: python
        run: |
          from pathlib import Path

          main = Path('src/main.rs')
          s = main.read_text()
          s = s.replace(
              'fallback_password.as_deref(),',
              'fallback_password.as_ref().map(|password| password.as_str()),'
          )
          s = s.replace('&*key', '&key')
          main.write_text(s)

          archive = Path('src/recipient_archive.rs')
          s = archive.read_text()
          s = s.replace('&*archive_key', '&archive_key')
          s = s.replace('&*identity_key', '&identity_key')
          s = s.replace('&*key', '&key')
          for broken in (
              'assert_eq!(&identity_key, password_ &key);',
              'assert_eq!(&identity_key, password_ & *key);',
              'assert_eq!(&*identity_key, password_ & *key);',
          ):
              s = s.replace(
                  broken,
                  'assert_eq!(identity_key.as_ref(), password_key.as_ref());'
              )
          archive.write_text(s)

          integration = Path('tests/recipient.rs')
          s = integration.read_text()
          s = s.replace('recipient_archive::verify(&archive, archive_key.as_ref())',
                        'recipient_archive::verify(&archive, &archive_key)')
          s = s.replace('recipient_archive::extract(&archive, &output, None, archive_key.as_ref())',
                        'recipient_archive::extract(&archive, &output, None, &archive_key)')
          integration.write_text(s)
      - name: Validate
        run: |
          cargo fmt --all
          cargo check --all-features
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-features
      - name: Commit fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.rs src/recipient_archive.rs tests/recipient.rs
          git commit -m "fix: validate native recipient archive streaming"
          git push origin HEAD:test
