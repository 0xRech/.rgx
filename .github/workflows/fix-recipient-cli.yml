name: Fix recipient CLI test branch

on:
  push:
    branches: [test]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Fix fallback password type
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/main.rs')
          s = p.read_text()
          s = s.replace(
              'fallback_password.as_deref(),',
              'fallback_password.as_ref().map(|password| password.as_str()),'
          )
          p.write_text(s)
      - name: Validate
        run: |
          cargo fmt --all
          cargo check --all-features
          cargo clippy --all-targets --all-features -- -D warnings
      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.rs
          git commit -m "fix: pass recipient fallback password as str"
          git push origin HEAD:test
