name: Packages

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - ".github/workflows/packages.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: 0xrech/rgx

jobs:
  validate-container:
    name: Validate GHCR container
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          platforms: linux/amd64
          tags: rgx:pr-test
          cache-from: type=gha
          provenance: false
          sbom: false

      - name: Smoke test RGX container
        run: |
          set -euo pipefail
          docker run --rm rgx:pr-test --version
          fixture="$(mktemp -d)"
          trap 'rm -rf "$fixture"' EXIT
          mkdir "$fixture/input"
          printf 'RGX container round trip\n' > "$fixture/input/hello.txt"
          docker run --rm --user "$(id -u):$(id -g)" -v "$fixture:/data" rgx:pr-test pack input plain.rgx
          docker run --rm --user "$(id -u):$(id -g)" -v "$fixture:/data" rgx:pr-test verify plain.rgx
          docker run --rm --user "$(id -u):$(id -g)" -v "$fixture:/data" rgx:pr-test extract plain.rgx restored
          cmp "$fixture/input/hello.txt" "$fixture/restored/input/hello.txt"
          docker run --rm --user "$(id -u):$(id -g)" -v "$fixture:/data" rgx:pr-test benchmark input --no-7zip

  publish-container:
    name: Publish GHCR container
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate OCI metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=auto
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            # Preserve the Git tag without making arbitrary v* tags latest.
            # Only stable SemVer rules below may generate latest.
            type=raw,value={{tag}},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=RGX
            org.opencontainers.image.description=Reference implementation of the .rgx archive format
            org.opencontainers.image.vendor=Rech Group

      - name: Build and publish package
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
