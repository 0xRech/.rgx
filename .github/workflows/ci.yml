name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format and Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --all-features
      - name: Test Windows .rgx shell registration
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --locked
          $rgxExe = (Resolve-Path '.\target\debug\rgx.exe').Path
          .\packaging\windows\register-rgx.ps1 -RgxExe $rgxExe
          try {
            $extension = Get-Item 'HKCU:\Software\Classes\.rgx'
            if ($extension.GetValue('') -ne 'RGX.Archive') {
              throw 'The .rgx extension was not registered with the RGX.Archive ProgID.'
            }
            if (-not (Test-Path "$env:LOCALAPPDATA\RGX\Shell\rgx-file.ico")) {
              throw 'The RGX file icon was not generated.'
            }
            foreach ($verb in @('RGX.Info', 'RGX.Extract', 'RGX.Verify')) {
              if (-not (Test-Path "HKCU:\Software\Classes\SystemFileAssociations\.rgx\shell\$verb\command")) {
                throw "Missing Explorer context-menu verb: $verb"
              }
            }
          }
          finally {
            .\packaging\windows\register-rgx.ps1 -Unregister
          }
          if (Test-Path 'HKCU:\Software\Classes\RGX.Archive') {
            throw 'RGX.Archive ProgID remained after unregistering.'
          }

  msrv:
    name: MSRV 1.88
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - run: cargo check --locked --all-features

  linux-static-release:
    name: Linux static release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install musl linker
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: Verify static binary
        run: |
          file target/x86_64-unknown-linux-musl/release/rgx
          if readelf -lW target/x86_64-unknown-linux-musl/release/rgx | grep -q 'Requesting program interpreter'; then
            echo 'Linux release binary unexpectedly requires a dynamic loader'
            exit 1
          fi
