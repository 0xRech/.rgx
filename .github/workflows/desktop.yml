name: Desktop

on:
  push:
    branches: [main, test]
    paths:
      - "desktop/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/desktop.yml"
      - ".github/workflows/release.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/desktop.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Desktop check (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
            bundles: deb,appimage
          - os: windows-latest
            label: Windows
            bundles: nsis
          - os: macos-latest
            label: macOS
            bundles: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml -- --check

      - name: Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --manifest-path desktop/src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test desktop backend
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Smoke-test native bundle
        working-directory: desktop
        run: cargo tauri build --bundles "${{ matrix.bundles }}"
