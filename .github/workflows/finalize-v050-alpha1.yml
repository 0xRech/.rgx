name: Finalize v0.5.0-alpha1 implementation

on:
  push:
    branches: [test]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Wire key protection and signatures into the CLI
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("src/main.rs")
          text = path.read_text()

          import_anchor = "use rgx::recipient_archive::{self, UnlockMethod};\n"
          if "use rgx::signature;\n" not in text:
              if import_anchor not in text:
                  raise SystemExit("recipient_archive import anchor not found")
              text = text.replace(import_anchor, import_anchor + "use rgx::signature;\n", 1)

          keygen_pattern = re.compile(
              r"    /// Generate an X25519 RGX identity\. Defaults to ~/\.ssh/id_rgx\.\n"
              r"    Keygen \{.*?^    \},\n",
              re.MULTILINE | re.DOTALL,
          )
          keygen_lines = [
              "    /// Generate an X25519 + Ed25519 RGX identity. Defaults to ~/.ssh/id_rgx.",
              "    Keygen {",
              "        /// Private-key destination. The public key is written with a .pub suffix.",
              "        #[arg(short, long, value_name = \"PATH\")]",
              "        output: Option<PathBuf>,",
              "        /// Protect the private-key file with Argon2id + XChaCha20-Poly1305.",
              "        #[arg(long)]",
              "        protect: bool,",
              "        /// Read the key-protection passphrase from this environment variable.",
              "        #[arg(long, value_name = \"NAME\")]",
              "        password_env: Option<String>,",
              "    },",
              "    /// Create a detached Ed25519 signature for an RGX archive.",
              "    Sign {",
              "        archive: PathBuf,",
              "        /// RGX private identity. Defaults to ~/.ssh/id_rgx.",
              "        #[arg(long, value_name = \"PRIVATE_KEY\")]",
              "        identity: Option<PathBuf>,",
              "        /// Signature destination. Defaults to ARCHIVE.sig.",
              "        #[arg(short, long, value_name = \"PATH\")]",
              "        output: Option<PathBuf>,",
              "        /// Read a protected identity passphrase from this environment variable.",
              "        #[arg(long, value_name = \"NAME\")]",
              "        key_password_env: Option<String>,",
              "    },",
              "    /// Verify a detached RGX Ed25519 signature.",
              "    VerifySignature {",
              "        archive: PathBuf,",
              "        signature: PathBuf,",
              "        /// Trusted RGX public key containing the Ed25519 verification key.",
              "        #[arg(long, value_name = \"PUBLIC_KEY\")]",
              "        public_key: PathBuf,",
              "    },",
          ]
          if "VerifySignature {" not in text:
              text, count = keygen_pattern.subn("\n".join(keygen_lines) + "\n", text, count=1)
              if count != 1:
                  raise SystemExit("Keygen command anchor not found")

          keygen_arm_pattern = re.compile(
              r"        Commands::Keygen \{ output \} => \{.*?^        \}\n"
              r"(?=        Commands::Extract)",
              re.MULTILINE | re.DOTALL,
          )
          arm_lines = [
              "        Commands::Keygen {",
              "            output,",
              "            protect,",
              "            password_env,",
              "        } => {",
              "            let private_path = match output {",
              "                Some(path) => path,",
              "                None => recipient::default_private_key_path()?,",
              "            };",
              "            let (key_id, public_path) = if protect {",
              "                let password = obtain_password(password_env.as_deref(), true)?;",
              "                recipient::generate_and_save_keypair_protected(",
              "                    &private_path,",
              "                    password.as_str(),",
              "                )?",
              "            } else {",
              "                if password_env.is_some() {",
              "                    bail!(\"--password-env requires --protect when generating an RGX identity\");",
              "                }",
              "                recipient::generate_and_save_keypair(&private_path)?",
              "            };",
              "            println!(\"Created private key: {}\", private_path.display());",
              "            println!(\"Created public key:  {}\", public_path.display());",
              "            println!(\"Key-ID: {}\", recipient::format_key_id(&key_id));",
              "            println!(\"Recipient key: X25519\");",
              "            println!(\"Signing key: Ed25519\");",
              "            println!(",
              "                \"Private-key protection: {}\",",
              "                if protect {",
              "                    \"Argon2id + XChaCha20-Poly1305\"",
              "                } else {",
              "                    \"filesystem permissions\"",
              "                }",
              "            );",
              "        }",
              "        Commands::Sign {",
              "            archive,",
              "            identity,",
              "            output,",
              "            key_password_env,",
              "        } => {",
              "            let identity_path = match identity {",
              "                Some(path) => path,",
              "                None => recipient::default_private_key_path()?,",
              "            };",
              "            let private_key = if recipient::private_key_is_protected(&identity_path)? {",
              "                let passphrase = obtain_key_passphrase(key_password_env.as_deref())?;",
              "                recipient::load_private_key_with_password(",
              "                    &identity_path,",
              "                    Some(passphrase.as_str()),",
              "                )?",
              "            } else {",
              "                if key_password_env.is_some() {",
              "                    bail!(\"--key-password-env is only valid for a protected RGX identity\");",
              "                }",
              "                recipient::load_private_key(&identity_path)?",
              "            };",
              "            let signature_path =",
              "                output.unwrap_or_else(|| signature::default_signature_path(&archive));",
              "            let info = signature::sign_archive(&archive, &private_key, &signature_path)?;",
              "            println!(\"Created signature: {}\", signature_path.display());",
              "            println!(\"Signer Key-ID: {}\", recipient::format_key_id(&info.key_id));",
              "            println!(\"Archive BLAKE3: {}\", signature::format_hash(&info.archive_hash));",
              "        }",
              "        Commands::VerifySignature {",
              "            archive,",
              "            signature: signature_path,",
              "            public_key,",
              "        } => {",
              "            let info = signature::verify_archive_signature(",
              "                &archive,",
              "                &signature_path,",
              "                &public_key,",
              "            )?;",
              "            println!(\"Signature OK: {}\", archive.display());",
              "            println!(\"Signer Key-ID: {}\", recipient::format_key_id(&info.key_id));",
              "            println!(\"Archive BLAKE3: {}\", signature::format_hash(&info.archive_hash));",
              "        }",
          ]
          if "Commands::VerifySignature {" not in text:
              text, count = keygen_arm_pattern.subn("\n".join(arm_lines) + "\n", text, count=1)
              if count != 1:
                  raise SystemExit("Keygen match arm anchor not found")

          if "fn obtain_key_passphrase(" not in text:
              helper_anchor = "fn obtain_password(environment_name: Option<&str>, confirm: bool) -> Result<Zeroizing<String>> {\n"
              helper_lines = [
                  "fn obtain_key_passphrase(environment_name: Option<&str>) -> Result<Zeroizing<String>> {",
                  "    if let Some(name) = environment_name {",
                  "        let value = std::env::var(name)",
                  "            .with_context(|| format!(\"environment variable {name} is not set\"))?;",
                  "        if value.is_empty() {",
                  "            bail!(\"RGX key passphrase environment variable must not be empty\");",
                  "        }",
                  "        return Ok(Zeroizing::new(value));",
                  "    }",
                  "",
                  "    let password = Zeroizing::new(rpassword::prompt_password(\"RGX key passphrase: \")?);",
                  "    if password.is_empty() {",
                  "        bail!(\"RGX key passphrase must not be empty\");",
                  "    }",
                  "    Ok(password)",
                  "}",
                  "",
              ]
              if helper_anchor not in text:
                  raise SystemExit("password helper anchor not found")
              text = text.replace(helper_anchor, "\n".join(helper_lines) + helper_anchor, 1)

          path.write_text(text)
      - name: Resolve lockfile and format
        run: |
          cargo check --all-features
          cargo fmt --all
      - name: Run full test suite
        run: cargo test --locked --all-features
      - name: Commit finalized implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock src tests
          if git diff --cached --quiet; then
            echo "No finalization changes needed"
            exit 0
          fi
          git commit -m "feat: finalize RGX v0.5.0-alpha1 key implementation"
          git push origin HEAD:test
