name: RGX General Benchmark

on:
  push:
    branches: [test]

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binary
        run: cargo build --release --locked
      - name: Generate deterministic synthetic dataset
        shell: python
        run: |
          from pathlib import Path
          import random
          root = Path('benchmark-data')
          (root / 'small').mkdir(parents=True)
          (root / 'medium').mkdir(parents=True)
          (root / 'duplicates').mkdir(parents=True)
          rng = random.Random(20260908)
          for i in range(1200):
              text = (f'RGX synthetic record {i % 40:02d}\n' * 160).encode()
              (root / 'small' / f'record-{i:04d}.txt').write_bytes(text)
          bases = []
          for i in range(24):
              data = rng.randbytes(1024 * 1024)
              bases.append(data)
              (root / 'medium' / f'random-{i:02d}.bin').write_bytes(data)
          for i in range(72):
              (root / 'duplicates' / f'copy-{i:03d}.bin').write_bytes(bases[i % 8])
          patterned = (b'RGX-COMPRESSIBLE-BLOCK-' * 4096)
          for i in range(96):
              (root / 'medium' / f'pattern-{i:03d}.bin').write_bytes(patterned)
          total = sum(p.stat().st_size for p in root.rglob('*') if p.is_file())
          files = sum(1 for p in root.rglob('*') if p.is_file())
          print(f'DATASET_BYTES={total}')
          print(f'DATASET_FILES={files}')
      - name: Runner details
        run: |
          uname -a
          lscpu | sed -n '1,20p'
          df -h .
      - name: Benchmark RGX, Private and ZIP three times
        run: |
          for run in 1 2 3; do
            echo "===== BUILTIN_RUN_${run} ====="
            ./target/release/rgx benchmark benchmark-data --private --no-7zip
          done
      - name: Benchmark native recipient mode three times
        run: |
          set -u
          rm -rf bench-home
          mkdir -p bench-home
          HOME="$PWD/bench-home" USERPROFILE="$PWD/bench-home" ./target/release/rgx keygen
          ls -la bench-home/.ssh
          for run in 1 2 3; do
            rm -f "recipient-${run}.rgx"
            rm -rf "recipient-out-${run}"
            echo "===== RECIPIENT_RUN_${run} ====="
            if ! /usr/bin/time -f 'RECIPIENT_PACK_SECONDS=%e' ./target/release/rgx pack benchmark-data "recipient-${run}.rgx" --recipient "$PWD/bench-home/.ssh/id_rgx.pub" 2>"recipient-pack-${run}.time"; then
              echo "RECIPIENT_PACK_FAILED"
              cat "recipient-pack-${run}.time"
              exit 1
            fi
            cat "recipient-pack-${run}.time"
            stat --printf='RECIPIENT_SIZE_BYTES=%s\n' "recipient-${run}.rgx"
            if ! /usr/bin/time -f 'RECIPIENT_EXTRACT_SECONDS=%e' ./target/release/rgx extract "recipient-${run}.rgx" "recipient-out-${run}" --identity "$PWD/bench-home/.ssh/id_rgx" 2>"recipient-extract-${run}.time"; then
              echo "RECIPIENT_EXTRACT_FAILED"
              cat "recipient-extract-${run}.time"
              exit 1
            fi
            cat "recipient-extract-${run}.time"
            ./target/release/rgx verify "recipient-${run}.rgx" --identity "$PWD/bench-home/.ssh/id_rgx"
          done
      - name: General release CLI smoke test
        env:
          RGX_BENCH_PASSWORD: rgx-general-test-password-2026
        run: |
          set -euo pipefail
          rm -rf smoke && mkdir smoke
          printf 'hello rgx\n' > smoke/hello.txt
          mkdir smoke/nested
          cp smoke/hello.txt smoke/nested/duplicate.txt

          ./target/release/rgx pack smoke smoke-plain.rgx
          ./target/release/rgx verify smoke-plain.rgx
          ./target/release/rgx list smoke-plain.rgx | grep 'smoke/hello.txt'
          ./target/release/rgx find smoke-plain.rgx hello | grep 'smoke/hello.txt'
          test "$(./target/release/rgx cat smoke-plain.rgx smoke/hello.txt)" = 'hello rgx'
          ./target/release/rgx extract smoke-plain.rgx smoke-plain-out
          cmp smoke/hello.txt smoke-plain-out/smoke/hello.txt

          ./target/release/rgx pack smoke smoke-private.rgx --private --password-env RGX_BENCH_PASSWORD
          ./target/release/rgx verify smoke-private.rgx --password-env RGX_BENCH_PASSWORD
          ./target/release/rgx extract smoke-private.rgx smoke-private-out --password-env RGX_BENCH_PASSWORD
          cmp smoke/hello.txt smoke-private-out/smoke/hello.txt

          rm -rf smoke-home fallback-home
          mkdir -p smoke-home fallback-home
          HOME="$PWD/smoke-home" USERPROFILE="$PWD/smoke-home" ./target/release/rgx keygen
          ./target/release/rgx pack smoke smoke-recipient.rgx --recipient "$PWD/smoke-home/.ssh/id_rgx.pub" --password-fallback --password-env RGX_BENCH_PASSWORD
          HOME="$PWD/smoke-home" USERPROFILE="$PWD/smoke-home" ./target/release/rgx verify smoke-recipient.rgx
          ./target/release/rgx extract smoke-recipient.rgx smoke-recipient-out --identity "$PWD/smoke-home/.ssh/id_rgx"
          cmp smoke/hello.txt smoke-recipient-out/smoke/hello.txt
          HOME="$PWD/fallback-home" USERPROFILE="$PWD/fallback-home" ./target/release/rgx verify smoke-recipient.rgx --password-env RGX_BENCH_PASSWORD | grep 'Unlocked with password fallback'

          cp smoke-recipient.rgx smoke-tampered.rgx
          python - <<'PY'
          from pathlib import Path
          p = Path('smoke-tampered.rgx')
          b = bytearray(p.read_bytes())
          b[-1] ^= 0x80
          p.write_bytes(b)
          PY
          if ./target/release/rgx verify smoke-tampered.rgx --identity "$PWD/smoke-home/.ssh/id_rgx"; then
            echo 'tampered recipient archive unexpectedly verified'
            exit 1
          fi

          echo 'GENERAL_SMOKE_TEST=PASS'
