name: Synchronize website with v0.5

on:
  push:
    branches:
      - website

permissions:
  contents: write

concurrency:
  group: sync-v05-website
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: website
          fetch-depth: 0

      - name: Merge current main into website
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit -X theirs origin/main

      - name: Update static website for v0.5.0-alpha1
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          VERSION = "v0.5.0-alpha1"
          CACHE = "20260909-1"

          def load(path):
              return Path(path).read_text(encoding="utf-8")

          def save(path, text):
              Path(path).write_text(text, encoding="utf-8")

          def replace_range(text, start, end, replacement):
              a = text.find(start)
              if a < 0:
                  raise SystemExit(f"start marker not found: {start}")
              b = text.find(end, a)
              if b < 0:
                  raise SystemExit(f"end marker not found: {end}")
              return text[:a] + replacement + text[b:]

          def replace_content_layout(path, aside_html, article_html):
              text = load(path)
              replacement = f'<div class="content-layout">{aside_html}{article_html}</div>'
              text, count = re.subn(
                  r'<div class="content-layout"><aside class="content-toc">.*?</aside><article class="prose">.*?</article></div>',
                  replacement,
                  text,
                  count=1,
                  flags=re.S,
              )
              if count != 1:
                  raise SystemExit(f"content layout not replaced in {path}")
              save(path, text)

          # Keep every visible static page on one source-version label and bust cached CSS/JS.
          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              text = text.replace('v0.4.0-alpha.2', VERSION)
              text = text.replace('styles.css?v=20260904-8', f'styles.css?v={CACHE}')
              text = text.replace('script.js?v=20260904-8', f'script.js?v={CACHE}')
              path.write_text(text, encoding='utf-8')

          # German homepage.
          p = 'index.html'
          text = load(p)
          text = text.replace(
              'RGX ist ein experimentelles Archivformat mit Content-Defined Chunking, Deduplizierung, Zstandard-Kompression, authentifizierter Verschlüsselung und überprüfbarer Integrität.',
              'RGX ist ein experimentelles Archivformat mit Content-Defined Chunking, Deduplizierung, Zstandard-Kompression, X25519-Empfängerverschlüsselung, authentifizierten Streams und Ed25519-Signaturen.'
          )
          text = text.replace(
              'RGX kombiniert Content-Defined Chunking, archivweite Deduplizierung, Zstandard-Kompression und authentifizierte Verschlüsselung in einem kompakten experimentellen Format.',
              'RGX kombiniert Content-Defined Chunking, archivweite Deduplizierung, Zstandard-Kompression, passwortbasierte Private Archives, X25519-Empfänger-Keys und optionale Ed25519-Signaturen.'
          )
          text = text.replace('<span class="status-chip"><span></span>private</span>', '<span class="status-chip"><span></span>recipient</span>', 1)
          text = text.replace('<span>PRIVATE</span><strong>XChaCha20</strong>', '<span>PROTECT</span><strong>RGXR / RGXE</strong>', 1)
          text = text.replace(
              '<section class="logo-strip shell reveal"><span class="strip-label">Auf etablierten Bausteinen aufgebaut</span><div class="tech-row"><span>Zstandard</span><i></i><span>BLAKE3</span><i></i><span>Argon2id</span><i></i><span>XChaCha20-Poly1305</span></div></section>',
              '<section class="logo-strip shell reveal"><span class="strip-label">Auf etablierten Bausteinen aufgebaut</span><div class="tech-row"><span>Zstandard</span><i></i><span>BLAKE3</span><i></i><span>Argon2id</span><i></i><span>XChaCha20-Poly1305</span><i></i><span>X25519</span><i></i><span>Ed25519</span></div></section>'
          )
          text = text.replace(
              'Private Mode schützt den kompletten inneren Container – inklusive Pfade, Dateinamen, Chunk-IDs und Metadaten – mit authentifizierter Verschlüsselung.',
              'Private Mode schützt den kompletten inneren Container per Passwort. Recipient Mode verschlüsselt denselben Datenstrom mit einem zufälligen Archivschlüssel und verpackt ihn separat für bis zu 64 X25519-Empfänger.'
          )
          text = text.replace('<div><span>Frames</span><strong>Authenticated</strong></div>', '<div><span>Recipients</span><strong>X25519</strong></div>', 1)
          text = text.replace(
              'Jeder eindeutige Chunk und jede rekonstruierte Datei erhält eine unabhängige BLAKE3-Integritätsprüfung. Private Archive ergänzen authentifizierte Verschlüsselung.',
              'BLAKE3 prüft Chunks und rekonstruierte Dateien, AEAD schützt verschlüsselte Streams und optionale Ed25519-Signaturen authentifizieren die exakten Archivbytes gegen einen vertrauenswürdigen RGX-Public-Key.'
          )
          text = text.replace('<p>Private envelope</p>', '<p>Private / Recipient</p>', 1)

          security_de = '''<section class="section shell security-section"><div class="section-heading reveal"><div class="eyebrow">Security-Modell</div><h2>Konkrete Aussagen.<br><span class="gradient-text">Sichtbare Grenzen.</span></h2><p>RGX v0.5.0-alpha1 ergänzt den passwortbasierten Private Mode um X25519-Empfänger, native RGXR/RGXK-Streams, optional geschützte Identitäten und detached Ed25519-Signaturen. Das Projekt ist weiterhin nicht unabhängig kryptografisch auditiert.</p><a class="button button-secondary" href="/security/">Security-Modell lesen →</a></div><div class="security-panel reveal"><div class="crypto-grid"><div><span>Recipients</span><strong>X25519</strong><small>bis zu 64 Key-Slots</small></div><div><span>AEAD</span><strong>XChaCha20-Poly1305</strong><small>authentifizierte Frames</small></div><div><span>Integrity</span><strong>BLAKE3</strong><small>Chunks + Dateien + Archive</small></div><div><span>Authenticity</span><strong>Ed25519</strong><small>detached signatures</small></div></div><div class="security-warning"><strong>v0.5 Alpha</strong><p>Recipient Mode verwendet pro Archiv einen zufälligen 256-Bit-Schlüssel, der separat für jeden X25519-Empfänger verpackt wird. Ein optionaler Passwort-Fallback ist möglich; ungeschützte lokale Identitäten verlassen sich auf den Schutz des Betriebssystems und Dateisystems.</p></div></div></section>'''
          text = replace_range(text, '<section class="section shell security-section">', '<section class="section benchmark-section" id="benchmark">', security_de)

          benchmark_de = '''<section class="section benchmark-section" id="benchmark"><div class="shell benchmark-grid"><div class="benchmark-card reveal"><div class="bench-command"><div><span class="eyebrow">v0.5 Recipient Snapshot</span><h3>109,02 MiB · 1.392 Dateien · 3 Läufe</h3></div><button class="copy-command" data-copy="rgx benchmark ./project --private" aria-label="Benchmark-Befehl kopieren">⧉</button></div><div class="bench-table"><div class="bench-row bench-header"><span>METHOD</span><span>SIZE</span><span>PACK</span><span>EXTRACT</span></div><div class="bench-row"><strong>RGX</strong><span>24,18 MiB</span><span>0,63 s</span><span>0,18 s</span></div><div class="bench-row featured"><strong>RGX Recipient</strong><span>24,18 MiB</span><span>0,64 s</span><span>0,46 s</span></div><div class="bench-row"><strong>RGX Private</strong><span>24,18 MiB</span><span>0,74 s</span><span>0,52 s</span></div><div class="bench-row"><strong>ZIP / Deflate</strong><span>96,30 MiB</span><span>3,26 s</span><span>0,19 s</span></div></div></div><div class="section-heading reveal"><div class="eyebrow">Messen statt Marketing</div><h2>Recipient Mode ist jetzt Teil der Messungen.</h2><p>Der aktuelle synthetische Linux-Test zeigt den nativen RGXR/RGXK-Pfad neben Plain, Private und ZIP. Die Werte sind ein Implementierungs-Snapshot und keine universelle Leistungszusage.</p><ul class="clean-list"><li><span>✓</span>77,77 % deduplizierter logischer Anteil</li><li><span>✓</span>Median aus drei Läufen</li><li><span>✓</span>Recipient und Private mit gleicher Archivgröße</li><li><span>✓</span>Reale Windows/macOS-v0.4-Baselines bleiben dokumentiert</li></ul><a class="button button-secondary" href="https://github.com/0xRech/.rgx/blob/main/docs/BENCHMARKS.md" rel="noreferrer">Benchmark-Dokumentation ↗</a></div></div></section>'''
          text = replace_range(text, '<section class="section benchmark-section" id="benchmark">', '<section class="section shell"><div class="section-heading centered reveal"><div class="eyebrow">CLI zuerst</div>', benchmark_de)

          cli_de = '''<section class="section shell"><div class="section-heading centered reveal"><div class="eyebrow">CLI zuerst</div><h2>Kleine Oberfläche.<br><span class="gradient-text">Klare Befehle.</span></h2><p>v0.5 erweitert die CLI um RGX-Identitäten, Empfänger-Archive und detached Signaturen.</p></div><div class="terminal-window reveal"><div class="terminal-top"><span class="window-dots"><i></i><i></i><i></i></span><div class="terminal-tabs" role="tablist"><button class="terminal-tab active" role="tab" aria-selected="true" data-terminal="recipient">Recipient</button><button class="terminal-tab" role="tab" aria-selected="false" data-terminal="private">Private</button><button class="terminal-tab" role="tab" aria-selected="false" data-terminal="sign">Sign</button><button class="terminal-tab" role="tab" aria-selected="false" data-terminal="verify">Verify</button></div><span class="terminal-shell mono">rgx</span></div><div class="terminal-body mono"><div class="terminal-pane active" role="tabpanel" data-pane="recipient"><p><span class="prompt">$</span> rgx keygen</p><p><span class="prompt">$</span> rgx pack ./project project.rgx --recipient ~/.ssh/id_rgx.pub</p><p class="terminal-success">Created project.rgx</p></div><div class="terminal-pane" role="tabpanel" data-pane="private"><p><span class="prompt">$</span> rgx pack ./project private.rgx --private</p><p class="terminal-output">RGX password: ••••••••••••••</p><p class="terminal-success">Created private.rgx</p></div><div class="terminal-pane" role="tabpanel" data-pane="sign"><p><span class="prompt">$</span> rgx sign project.rgx --identity ~/.ssh/id_rgx</p><p class="terminal-success">Created project.rgx.sig</p></div><div class="terminal-pane" role="tabpanel" data-pane="verify"><p><span class="prompt">$</span> rgx verify-signature project.rgx project.rgx.sig --public-key ~/.ssh/id_rgx.pub</p><p class="terminal-success">Signature valid</p></div></div></div><div class="doc-links"><a class="doc-card reveal" href="/format/"><span>FORMAT</span><h3>Binärformat</h3><p>RGX\0, RGXE v0.4 sowie RGXR v2 + RGXK v1.</p><i>→</i></a><a class="doc-card reveal" href="/security/"><span>SECURITY</span><h3>Threat Model &amp; Grenzen</h3><p>Private Mode, Recipient Mode, Key-Schutz und Signaturen.</p><i>→</i></a><a class="doc-card reveal" href="/roadmap/"><span>ROADMAP</span><h3>Wohin RGX geht</h3><p>v0.5-Hardening, smartere Kompression, Snapshots und mehr.</p><i>→</i></a></div></section>'''
          text = replace_range(text, '<section class="section shell"><div class="section-heading centered reveal"><div class="eyebrow">CLI zuerst</div>', '<section class="section roadmap-section">', cli_de)

          roadmap_de = '''<section class="section roadmap-section"><div class="shell"><div class="section-heading reveal"><div class="eyebrow">Roadmap</div><h2>Bewusst in Schichten gebaut.</h2><p>RGX ist pre-1.0. v0.5.0-alpha1 implementiert Recipient Identities und Signaturen; unabhängige Prüfung und plattformgestützter Key-Schutz bleiben Hardening-Arbeit.</p></div><div class="roadmap-track reveal"><div class="roadmap-item done"><span class="roadmap-dot">✓</span><small>v0.2</small><h3>Chunking + dedup</h3><p>Streaming, CDC, archivweite Deduplizierung.</p></div><div class="roadmap-item done"><span class="roadmap-dot">✓</span><small>v0.3</small><h3>Private + benchmark</h3><p>Argon2id, XChaCha20-Poly1305, Vergleichstooling.</p></div><div class="roadmap-item done"><span class="roadmap-dot">✓</span><small>v0.4</small><h3>Streaming + selective access</h3><p>Seekable encrypted I/O, find, cat und selektives Entpacken.</p></div><div class="roadmap-item current"><span class="roadmap-dot">●</span><small>v0.5 alpha</small><h3>Recipients + authenticity</h3><p>X25519, RGXR/RGXK, geschützte Identitäten und Ed25519-Signaturen.</p></div></div></div></section>'''
          text = replace_range(text, '<section class="section roadmap-section">', '<section class="section shell faq-section">', roadmap_de)

          faq_de = '''<section class="section shell faq-section"><div class="section-heading reveal"><div class="eyebrow">Fragen</div><h2>Wichtiger Kontext.</h2></div><div class="faq-grid"><details class="faq-item reveal"><summary>Ersetzt RGX schon ZIP oder 7-Zip?</summary><p>Noch nicht. RGX ist ein funktionales, aber experimentelles pre-1.0-Format und noch nicht unabhängig kryptografisch auditiert.</p></details><details class="faq-item reveal"><summary>Wie funktioniert automatisches Entschlüsseln?</summary><p>Recipient Mode sucht nach einer passenden RGX-Identität, standardmäßig unter ~/.ssh/id_rgx. Passt der X25519-Key zu einem Empfänger-Slot, wird der Archivschlüssel ohne Archivpasswort freigegeben.</p></details><details class="faq-item reveal"><summary>Kann ich weiterhin ein Passwort verwenden?</summary><p>Ja. Private Mode bleibt verfügbar. Recipient Archive können zusätzlich mit <code>--password-fallback</code> einen Argon2id-basierten Passwort-Fallback erhalten.</p></details></div></section>'''
          text = replace_range(text, '<section class="section shell faq-section">', '<section class="final-cta shell reveal">', faq_de)
          save(p, text)

          # English homepage.
          p = 'en/index.html'
          text = load(p)
          text = text.replace(
              'RGX is an experimental archive format built around content-defined chunking, deduplication, Zstandard compression, authenticated encryption and verifiable integrity.',
              'RGX is an experimental archive format with content-defined chunking, deduplication, Zstandard compression, X25519 recipient encryption, authenticated streams and Ed25519 signatures.'
          )
          text = text.replace(
              'RGX combines content-defined chunking, archive-wide deduplication, Zstandard compression and authenticated encryption in one compact experimental format.',
              'RGX combines content-defined chunking, archive-wide deduplication, Zstandard compression, password Private Mode, X25519 recipient keys and optional Ed25519 signatures.'
          )
          text = text.replace('<span class="status-chip"><span></span>private</span>', '<span class="status-chip"><span></span>recipient</span>', 1)
          text = text.replace('<span>PRIVATE</span><strong>XChaCha20</strong>', '<span>PROTECT</span><strong>RGXR / RGXE</strong>', 1)
          text = text.replace(
              '<section class="logo-strip shell reveal"><span class="strip-label">Built on established primitives</span><div class="tech-row"><span>Zstandard</span><i></i><span>BLAKE3</span><i></i><span>Argon2id</span><i></i><span>XChaCha20-Poly1305</span></div></section>',
              '<section class="logo-strip shell reveal"><span class="strip-label">Built on established primitives</span><div class="tech-row"><span>Zstandard</span><i></i><span>BLAKE3</span><i></i><span>Argon2id</span><i></i><span>XChaCha20-Poly1305</span><i></i><span>X25519</span><i></i><span>Ed25519</span></div></section>'
          )
          text = text.replace(
              'Private Mode protects the complete inner container — including paths, file names, chunk identifiers and metadata — using authenticated encryption.',
              'Private Mode protects the complete inner container with a password. Recipient Mode encrypts the same stream under a random archive key and wraps it separately for up to 64 X25519 recipients.'
          )
          text = text.replace('<div><span>Frames</span><strong>Authenticated</strong></div>', '<div><span>Recipients</span><strong>X25519</strong></div>', 1)
          text = text.replace(
              'Every unique chunk and reconstructed file carries an independent BLAKE3 integrity check. Private archives add authenticated encryption on top.',
              'BLAKE3 checks chunks and reconstructed files, AEAD protects encrypted streams, and optional Ed25519 signatures authenticate exact archive bytes against a trusted RGX public key.'
          )
          text = text.replace('<p>Private envelope</p>', '<p>Private / Recipient</p>', 1)

          security_en = '''<section class="section shell security-section"><div class="section-heading reveal"><div class="eyebrow">Security model</div><h2>Specific claims.<br><span class="gradient-text">Visible limits.</span></h2><p>RGX v0.5.0-alpha1 extends password Private Mode with X25519 recipients, native RGXR/RGXK streams, optionally protected identities and detached Ed25519 signatures. The project still has not received an independent cryptographic audit.</p><a class="button button-secondary" href="/en/security/">Read security model →</a></div><div class="security-panel reveal"><div class="crypto-grid"><div><span>Recipients</span><strong>X25519</strong><small>up to 64 key slots</small></div><div><span>AEAD</span><strong>XChaCha20-Poly1305</strong><small>authenticated frames</small></div><div><span>Integrity</span><strong>BLAKE3</strong><small>chunks + files + archives</small></div><div><span>Authenticity</span><strong>Ed25519</strong><small>detached signatures</small></div></div><div class="security-warning"><strong>v0.5 Alpha</strong><p>Recipient Mode creates a random 256-bit archive key and wraps it separately for every X25519 recipient. An optional password fallback is available; unprotected local identities rely on host and filesystem protection.</p></div></div></section>'''
          text = replace_range(text, '<section class="section shell security-section">', '<section class="section benchmark-section" id="benchmark">', security_en)

          benchmark_en = '''<section class="section benchmark-section" id="benchmark"><div class="shell benchmark-grid"><div class="benchmark-card reveal"><div class="bench-command"><div><span class="eyebrow">v0.5 Recipient Snapshot</span><h3>109.02 MiB · 1,392 files · 3 runs</h3></div><button class="copy-command" data-copy="rgx benchmark ./project --private" aria-label="Copy benchmark command">⧉</button></div><div class="bench-table"><div class="bench-row bench-header"><span>METHOD</span><span>SIZE</span><span>PACK</span><span>EXTRACT</span></div><div class="bench-row"><strong>RGX</strong><span>24.18 MiB</span><span>0.63 s</span><span>0.18 s</span></div><div class="bench-row featured"><strong>RGX Recipient</strong><span>24.18 MiB</span><span>0.64 s</span><span>0.46 s</span></div><div class="bench-row"><strong>RGX Private</strong><span>24.18 MiB</span><span>0.74 s</span><span>0.52 s</span></div><div class="bench-row"><strong>ZIP / Deflate</strong><span>96.30 MiB</span><span>3.26 s</span><span>0.19 s</span></div></div></div><div class="section-heading reveal"><div class="eyebrow">Measure, don’t market</div><h2>Recipient Mode is now part of the measurements.</h2><p>The current synthetic Linux test shows the native RGXR/RGXK path next to Plain, Private and ZIP. These numbers are an implementation snapshot, not a universal performance claim.</p><ul class="clean-list"><li><span>✓</span>77.77% deduplicated logical share</li><li><span>✓</span>Median of three runs</li><li><span>✓</span>Recipient and Private produced the same archive size</li><li><span>✓</span>Real v0.4 Windows/macOS baselines remain documented</li></ul><a class="button button-secondary" href="https://github.com/0xRech/.rgx/blob/main/docs/BENCHMARKS.md" rel="noreferrer">Benchmark documentation ↗</a></div></div></section>'''
          text = replace_range(text, '<section class="section benchmark-section" id="benchmark">', '<section class="section shell"><div class="section-heading centered reveal"><div class="eyebrow">CLI first</div>', benchmark_en)

          cli_en = '''<section class="section shell"><div class="section-heading centered reveal"><div class="eyebrow">CLI first</div><h2>Small surface.<br><span class="gradient-text">Clear commands.</span></h2><p>v0.5 extends the CLI with RGX identities, recipient archives and detached signatures.</p></div><div class="terminal-window reveal"><div class="terminal-top"><span class="window-dots"><i></i><i></i><i></i></span><div class="terminal-tabs" role="tablist"><button class="terminal-tab active" role="tab" aria-selected="true" data-terminal="recipient">Recipient</button><button class="terminal-tab" role="tab" aria-selected="false" data-terminal="private">Private</button><button class="terminal-tab" role="tab" aria-selected="false" data-terminal="sign">Sign</button><button class="terminal-tab" role="tab" aria-selected="false" data-terminal="verify">Verify</button></div><span class="terminal-shell mono">rgx</span></div><div class="terminal-body mono"><div class="terminal-pane active" role="tabpanel" data-pane="recipient"><p><span class="prompt">$</span> rgx keygen</p><p><span class="prompt">$</span> rgx pack ./project project.rgx --recipient ~/.ssh/id_rgx.pub</p><p class="terminal-success">Created project.rgx</p></div><div class="terminal-pane" role="tabpanel" data-pane="private"><p><span class="prompt">$</span> rgx pack ./project private.rgx --private</p><p class="terminal-output">RGX password: ••••••••••••••</p><p class="terminal-success">Created private.rgx</p></div><div class="terminal-pane" role="tabpanel" data-pane="sign"><p><span class="prompt">$</span> rgx sign project.rgx --identity ~/.ssh/id_rgx</p><p class="terminal-success">Created project.rgx.sig</p></div><div class="terminal-pane" role="tabpanel" data-pane="verify"><p><span class="prompt">$</span> rgx verify-signature project.rgx project.rgx.sig --public-key ~/.ssh/id_rgx.pub</p><p class="terminal-success">Signature valid</p></div></div></div><div class="doc-links"><a class="doc-card reveal" href="/en/format/"><span>FORMAT</span><h3>Binary specification</h3><p>RGX\0, RGXE v0.4, plus RGXR v2 + RGXK v1.</p><i>→</i></a><a class="doc-card reveal" href="/en/security/"><span>SECURITY</span><h3>Threat model &amp; limits</h3><p>Private Mode, Recipient Mode, key protection and signatures.</p><i>→</i></a><a class="doc-card reveal" href="/en/roadmap/"><span>ROADMAP</span><h3>Where RGX is going</h3><p>v0.5 hardening, smarter compression, snapshots and more.</p><i>→</i></a></div></section>'''
          text = replace_range(text, '<section class="section shell"><div class="section-heading centered reveal"><div class="eyebrow">CLI first</div>', '<section class="section roadmap-section">', cli_en)

          roadmap_en = '''<section class="section roadmap-section"><div class="shell"><div class="section-heading reveal"><div class="eyebrow">Roadmap</div><h2>Built deliberately in layers.</h2><p>RGX is pre-1.0. v0.5.0-alpha1 implements recipient identities and signatures; independent review and platform-backed key protection remain hardening work.</p></div><div class="roadmap-track reveal"><div class="roadmap-item done"><span class="roadmap-dot">✓</span><small>v0.2</small><h3>Chunking + dedup</h3><p>Streaming, CDC and archive-wide deduplication.</p></div><div class="roadmap-item done"><span class="roadmap-dot">✓</span><small>v0.3</small><h3>Private + benchmark</h3><p>Argon2id, XChaCha20-Poly1305 and comparison tooling.</p></div><div class="roadmap-item done"><span class="roadmap-dot">✓</span><small>v0.4</small><h3>Streaming + selective access</h3><p>Seekable encrypted I/O, find, cat and selective extraction.</p></div><div class="roadmap-item current"><span class="roadmap-dot">●</span><small>v0.5 alpha</small><h3>Recipients + authenticity</h3><p>X25519, RGXR/RGXK, protected identities and Ed25519 signatures.</p></div></div></div></section>'''
          text = replace_range(text, '<section class="section roadmap-section">', '<section class="section shell faq-section">', roadmap_en)

          faq_en = '''<section class="section shell faq-section"><div class="section-heading reveal"><div class="eyebrow">Questions</div><h2>Important context.</h2></div><div class="faq-grid"><details class="faq-item reveal"><summary>Does RGX already replace ZIP or 7-Zip?</summary><p>Not yet. RGX is functional but remains an experimental pre-1.0 format and has not received an independent cryptographic audit.</p></details><details class="faq-item reveal"><summary>How does automatic decryption work?</summary><p>Recipient Mode searches for a matching RGX identity, by default at ~/.ssh/id_rgx. If its X25519 key matches a recipient slot, RGX unlocks the archive key without an archive password.</p></details><details class="faq-item reveal"><summary>Can I still use a password?</summary><p>Yes. Private Mode remains available. Recipient archives can additionally use <code>--password-fallback</code> to store an Argon2id-based password fallback.</p></details></div></section>'''
          text = replace_range(text, '<section class="section shell faq-section">', '<section class="final-cta shell reveal">', faq_en)
          save(p, text)

          # Full German security page.
          security_aside_de = '<aside class="content-toc"><strong>Auf dieser Seite</strong><a href="#status">Status</a><a href="#crypto">Kryptografisches Profil</a><a href="#properties">Geschützte Informationen</a><a href="#identities">Identitäten &amp; Signaturen</a><a href="#limits">Grenzen &amp; Hardening</a><a href="#report">Schwachstellen melden</a></aside>'
          security_article_de = '''<article class="prose"><section id="status"><h2>Status</h2><p>RGX v0.5.0-alpha1 ist experimentelle pre-1.0-Software. Die Implementierung verwendet etablierte Primitive, wurde aber noch nicht unabhängig kryptografisch auditiert und sollte in Hochrisiko-Umgebungen noch nicht als reifer Ersatz für langjährig geprüfte Werkzeuge betrachtet werden.</p></section><section id="crypto"><h2>Kryptografisches Profil</h2><table class="spec-table"><tr><th>Purpose</th><th>Primitive / parameter</th></tr><tr><td>Password KDF</td><td>Argon2id · 64 MiB · 3 iterations · lanes 1</td></tr><tr><td>Authenticated encryption</td><td>XChaCha20-Poly1305</td></tr><tr><td>Recipient key agreement</td><td>X25519</td></tr><tr><td>Recipient payload</td><td>RGXR v2 + RGXK v1 · 1 MiB authenticated frames</td></tr><tr><td>Integrity / IDs</td><td>BLAKE3</td></tr><tr><td>Detached signatures</td><td>Ed25519</td></tr></table></section><section id="properties"><h2>Geschützte Informationen</h2><p>Private Mode und Recipient Mode verschlüsseln den vollständigen inneren RGX-v0.2-Container. Dateiinhalte, Dateinamen, Pfade, Verzeichnisstruktur, Chunk-IDs, Chunk-Gleichheitsbeziehungen und innere Statistiken liegen damit nicht im Klartext in der äußeren Archivhülle.</p><p>Recipient Mode legt außen unter anderem die Anzahl der Empfänger, kurze Key-IDs, die Existenz eines optionalen Passwort-Fallbacks und die ungefähre verschlüsselte Gesamtgröße offen. Key-IDs enthalten keine Namen, können aber als stabile Kennung eine Verknüpfbarkeit zwischen Archiven erzeugen.</p></section><section id="identities"><h2>Identitäten &amp; Signaturen</h2><p>Neue RGX-v2-Identitäten enthalten X25519-Public-Material für Empfänger-Archive und Ed25519-Public-Material für detached Signaturen. Private Identitätsdateien können optional mit Argon2id + XChaCha20-Poly1305 geschützt werden.</p><p><code>rgx verify-signature</code> authentifiziert die exakten Archivbytes gegen einen vertrauenswürdigen RGX-Public-Key. Ob dieser Public-Key tatsächlich zu der erwarteten Person oder Organisation gehört, hängt weiterhin von einem vertrauenswürdigen Schlüsselaustausch ab.</p></section><section id="limits"><h2>Grenzen &amp; Hardening</h2><div class="content-card warning"><strong>Wichtige Grenzen der Alpha</strong><p>Ein Passwort-Fallback ist nur so stark wie das gewählte Passwort. Eine ungeschützte lokale RGX-Identität verlässt sich auf Betriebssystem-, Account- und Dateisystemschutz. Spezifisch gehärtete Windows-ACLs sowie OS-Keychain-, TPM- und Hardware-Token-Integration stehen weiterhin auf der Roadmap.</p></div></section><section id="report"><h2>Schwachstellen melden</h2><p>Exploit-Details bitte nicht zuerst öffentlich als Issue veröffentlichen. Wenn GitHubs Private Vulnerability Reporting für das Repository aktiviert ist, soll dieser Weg verwendet werden.</p></section></article>'''
          replace_content_layout('security/index.html', security_aside_de, security_article_de)

          security_aside_en = '<aside class="content-toc"><strong>On this page</strong><a href="#status">Status</a><a href="#crypto">Cryptographic profile</a><a href="#properties">Protected information</a><a href="#identities">Identities &amp; signatures</a><a href="#limits">Limits &amp; hardening</a><a href="#report">Reporting vulnerabilities</a></aside>'
          security_article_en = '''<article class="prose"><section id="status"><h2>Status</h2><p>RGX v0.5.0-alpha1 is experimental pre-1.0 software. The implementation uses established primitives, but it has not received an independent cryptographic audit and should not yet be treated as a mature replacement for long-established tools in high-risk environments.</p></section><section id="crypto"><h2>Cryptographic profile</h2><table class="spec-table"><tr><th>Purpose</th><th>Primitive / parameter</th></tr><tr><td>Password KDF</td><td>Argon2id · 64 MiB · 3 iterations · lanes 1</td></tr><tr><td>Authenticated encryption</td><td>XChaCha20-Poly1305</td></tr><tr><td>Recipient key agreement</td><td>X25519</td></tr><tr><td>Recipient payload</td><td>RGXR v2 + RGXK v1 · 1 MiB authenticated frames</td></tr><tr><td>Integrity / IDs</td><td>BLAKE3</td></tr><tr><td>Detached signatures</td><td>Ed25519</td></tr></table></section><section id="properties"><h2>Protected information</h2><p>Private Mode and Recipient Mode encrypt the complete inner RGX v0.2 container. File contents, names, paths, directory structure, chunk IDs, chunk equality relationships and inner statistics therefore do not appear as plaintext in the outer archive envelope.</p><p>Recipient Mode still exposes metadata such as the recipient count, short Key-IDs, whether a password fallback exists, and the approximate encrypted size. Key-IDs contain no names, but as stable identifiers they can create linkability across archives.</p></section><section id="identities"><h2>Identities &amp; signatures</h2><p>New RGX v2 identities contain X25519 public material for recipient archives and Ed25519 public material for detached signatures. Private identity files can optionally be protected with Argon2id + XChaCha20-Poly1305.</p><p><code>rgx verify-signature</code> authenticates the exact archive bytes against a trusted RGX public key. Whether that public key really belongs to the expected person or organization still depends on a trustworthy key exchange.</p></section><section id="limits"><h2>Limits &amp; hardening</h2><div class="content-card warning"><strong>Important alpha limitations</strong><p>A password fallback is only as strong as its password. An unprotected local RGX identity relies on OS account and filesystem protection. Windows-specific hardened ACL handling plus OS keychain, TPM and hardware-token integration remain roadmap work.</p></div></section><section id="report"><h2>Reporting vulnerabilities</h2><p>Please do not publish exploit details in a public issue first. Use GitHub private vulnerability reporting if it is enabled for the repository.</p></section></article>'''
          replace_content_layout('en/security/index.html', security_aside_en, security_article_en)

          # Format pages.
          p = 'format/index.html'
          text = load(p).replace('Technische Übersicht über den inneren Container und die private RGX-v0.3-Hülle.', 'Technische Übersicht über RGX\0, RGXE v0.4, RGXR v2, RGXK v1, RGX-v2-Identitäten und detached Signaturen.')
          save(p, text)
          format_aside_de = '<aside class="content-toc"><strong>Auf dieser Seite</strong><a href="#representations">Darstellungen</a><a href="#inner">Innerer RGX-v0.2-Container</a><a href="#private">Private RGXE v0.4</a><a href="#recipient">Recipient RGXR v2 + RGXK v1</a><a href="#identity">Identitäten &amp; Signaturen</a><a href="#compat">Kompatibilität</a></aside>'
          format_article_de = '''<article class="prose"><section id="representations"><h2>Drei Archivdarstellungen</h2><p>RGX v0.5.0-alpha1 kennt Plain <code>RGX\0</code>, passwortgeschütztes <code>RGXE</code> und Recipient Mode mit <code>RGXR</code> + <code>RGXK</code>. Detached <code>RGX-SIGNATURE-1</code>-Dateien signieren die exakten Bytes jeder dieser Darstellungen, ohne das Archiv selbst zu verändern.</p></section><section id="inner"><h2>Innerer RGX-v0.2-Container</h2><table class="spec-table"><tr><th>Record</th><th>Purpose</th></tr><tr><td>RGX\0</td><td>16-byte archive header</td></tr><tr><td>CHNK</td><td>Unique chunk payload + BLAKE3 identity + compression metadata</td></tr><tr><td>FILE</td><td>Path, file digest and ordered chunk references</td></tr><tr><td>DIRE</td><td>Directory path</td></tr><tr><td>RGXF</td><td>Footer statistics and consistency checks</td></tr></table><p>Referenz-Chunking: 64-Byte Rolling Window · 64 KiB Minimum · ungefähr 256 KiB Ziel · 1 MiB Maximum.</p></section><section id="private"><h2>Password Private — RGXE v0.4</h2><p>RGXE streamt genau einen inneren RGX-v0.2-Container durch authentifizierte 1-MiB-Frames. Der 32-Byte-Schlüssel wird mit Argon2id aus dem Passwort abgeleitet; die Frames verwenden XChaCha20-Poly1305.</p><div class="code-block">nonce = 16-byte random prefix || sequence_le_u64<br>AAD = exact RGXE header || frame header</div></section><section id="recipient"><h2>Recipient Mode — RGXR v2 + RGXK v1</h2><p>RGX erzeugt pro Archiv einen zufälligen 256-Bit-Archivschlüssel. Bis zu 64 Recipient-Slots verpacken denselben Schlüssel separat über X25519, BLAKE3-KDF-Kontext und XChaCha20-Poly1305. Optional kann ein Argon2id-Passwort-Slot denselben Archivschlüssel als Fallback verpacken.</p><p>Der verschlüsselte Payload beginnt mit <code>RGXK</code> und nutzt seekbare, authentifizierte 1-MiB-Frames. Ein BLAKE3-Hash des exakten RGXR-Headers wird in den authentifizierten RGXK-Header eingebunden, sodass Manipulationen an Recipient-Slots oder Headerdaten erkannt werden.</p></section><section id="identity"><h2>RGX-v2-Identitäten &amp; Signaturen</h2><p><code>RGX-PUBLIC-KEY-2</code> enthält X25519- und Ed25519-Public-Material. Private Keys können ungeschützt oder als <code>RGX-PRIVATE-KEY-2-ENCRYPTED</code> mit Argon2id + XChaCha20-Poly1305 gespeichert werden.</p><p><code>RGX-SIGNATURE-1</code> enthält Key-ID, exakte Archivlänge, BLAKE3-Digest und eine Ed25519-Signatur über die exakten Archivbytes.</p></section><section id="compat"><h2>Kompatibilität</h2><p>Plain bleibt inneres Format v0.2. Aktuelle Private Writer verwenden RGXE v0.4; der Reader behält v0.3-Kompatibilität. v0.5.0-alpha1 Recipient Writer verwenden RGXR v2 + RGXK v1. Neue Identitäten sind v2; Legacy-v1-Recipient-Keys können weiterhin geladen werden, besitzen aber keinen Ed25519-Verifikationskey.</p></section></article>'''
          replace_content_layout('format/index.html', format_aside_de, format_article_de)

          p = 'en/format/index.html'
          text = load(p)
          text = text.replace('Technical overview of the inner container and private RGX v0.3 envelope.', 'Technical overview of RGX\0, RGXE v0.4, RGXR v2, RGXK v1, RGX v2 identities and detached signatures.')
          save(p, text)
          format_aside_en = '<aside class="content-toc"><strong>On this page</strong><a href="#representations">Representations</a><a href="#inner">Inner RGX v0.2 container</a><a href="#private">Private RGXE v0.4</a><a href="#recipient">Recipient RGXR v2 + RGXK v1</a><a href="#identity">Identities &amp; signatures</a><a href="#compat">Compatibility</a></aside>'
          format_article_en = '''<article class="prose"><section id="representations"><h2>Three archive representations</h2><p>RGX v0.5.0-alpha1 supports plain <code>RGX\0</code>, password-protected <code>RGXE</code>, and Recipient Mode using <code>RGXR</code> + <code>RGXK</code>. Detached <code>RGX-SIGNATURE-1</code> files sign the exact bytes of any representation without modifying the archive.</p></section><section id="inner"><h2>Inner RGX v0.2 container</h2><table class="spec-table"><tr><th>Record</th><th>Purpose</th></tr><tr><td>RGX\0</td><td>16-byte archive header</td></tr><tr><td>CHNK</td><td>Unique chunk payload + BLAKE3 identity + compression metadata</td></tr><tr><td>FILE</td><td>Path, file digest and ordered chunk references</td></tr><tr><td>DIRE</td><td>Directory path</td></tr><tr><td>RGXF</td><td>Footer statistics and consistency checks</td></tr></table><p>Reference chunking: 64-byte rolling window · 64 KiB minimum · about 256 KiB target · 1 MiB maximum.</p></section><section id="private"><h2>Password Private — RGXE v0.4</h2><p>RGXE streams exactly one inner RGX v0.2 container through authenticated 1 MiB frames. Argon2id derives the 32-byte key from the password; frames use XChaCha20-Poly1305.</p><div class="code-block">nonce = 16-byte random prefix || sequence_le_u64<br>AAD = exact RGXE header || frame header</div></section><section id="recipient"><h2>Recipient Mode — RGXR v2 + RGXK v1</h2><p>RGX creates a fresh random 256-bit archive key. Up to 64 recipient slots wrap the same key separately using X25519, a BLAKE3 derive-key context and XChaCha20-Poly1305. An optional Argon2id password slot can wrap the same archive key as a fallback.</p><p>The encrypted payload starts with <code>RGXK</code> and uses seekable authenticated 1 MiB frames. A BLAKE3 hash of the exact RGXR header is bound into the authenticated RGXK header so recipient-slot or header tampering is detected.</p></section><section id="identity"><h2>RGX v2 identities &amp; signatures</h2><p><code>RGX-PUBLIC-KEY-2</code> contains X25519 and Ed25519 public material. Private keys may be stored unprotected or as <code>RGX-PRIVATE-KEY-2-ENCRYPTED</code> using Argon2id + XChaCha20-Poly1305.</p><p><code>RGX-SIGNATURE-1</code> contains the Key-ID, exact archive length, BLAKE3 digest and an Ed25519 signature over the exact archive bytes.</p></section><section id="compat"><h2>Compatibility</h2><p>Plain remains inner format v0.2. Current Private writers use RGXE v0.4 and the reader retains v0.3 compatibility. v0.5.0-alpha1 recipient writers use RGXR v2 + RGXK v1. New identities are v2; legacy v1 recipient keys can still be loaded but do not carry an Ed25519 verification key.</p></section></article>'''
          replace_content_layout('en/format/index.html', format_aside_en, format_article_en)

          # Documentation pages.
          p = 'docs/index.html'
          text = load(p).replace('CLI, Private Mode, Verifikation und Benchmarking der aktuellen RGX-v0.4-Alpha-Referenzimplementierung.', 'CLI, Private Mode, Recipient Mode, RGX-Identitäten, Signaturen und Benchmarking der aktuellen RGX-v0.5-Alpha-Referenzimplementierung.')
          save(p, text)
          docs_aside_de = '<aside class="content-toc"><strong>Auf dieser Seite</strong><a href="#start">Schnellstart</a><a href="#recipient">Recipient Mode</a><a href="#identities">Identitäten</a><a href="#signatures">Signaturen</a><a href="#private">Private Mode</a><a href="#selective">Selektiver Zugriff</a><a href="#benchmark">Benchmark</a><a href="#automation">Automatisierung</a></aside>'
          docs_article_de = '''<article class="prose"><section id="start"><h2>Schnellstart</h2><div class="code-block">rgx pack ./project project.rgx<br>rgx list project.rgx<br>rgx info project.rgx<br>rgx verify project.rgx<br>rgx extract project.rgx ./restore</div></section><section id="recipient"><h2>Recipient Mode</h2><p>Erzeuge eine dedizierte RGX-Identität und verschlüssele das Archiv für den Public Key. RGX verwendet keine beliebigen SSH-Private-Keys; der Standardpfad liegt nur aus Komfortgründen unter <code>~/.ssh</code>.</p><div class="code-block">rgx keygen<br>rgx pack ./project project-recipient.rgx --recipient ~/.ssh/id_rgx.pub<br>rgx extract project-recipient.rgx ./restore</div><p>Mit der passenden ungeschützten <code>~/.ssh/id_rgx</code> erfolgt der Unlock automatisch ohne Archivpasswort. Mehrere <code>--recipient</code>-Argumente und <code>--password-fallback</code> sind möglich.</p></section><section id="identities"><h2>Geschützte Identitäten</h2><div class="code-block">rgx keygen --protect</div><p>Geschützte Private-Key-Dateien verwenden Argon2id + XChaCha20-Poly1305. Die Identity-Passphrase ist getrennt von einem möglichen Archiv-Passwort-Fallback.</p></section><section id="signatures"><h2>Detached Ed25519-Signaturen</h2><div class="code-block">rgx sign backup.rgx --identity ~/.ssh/id_rgx<br>rgx verify-signature backup.rgx backup.rgx.sig --public-key ~/.ssh/id_rgx.pub</div><p><code>rgx verify</code> prüft Archivstruktur und Integrität. <code>verify-signature</code> prüft zusätzlich, dass exakt diese Archivbytes vom Besitzer des passenden RGX-Private-Keys signiert wurden.</p></section><section id="private"><h2>Password Private Mode</h2><p><code>--private</code> bleibt als passwortbasierter Modus erhalten.</p><div class="code-block">rgx pack ./project project-private.rgx --private</div><div class="content-card warning"><strong>Wichtig</strong><p>v0.5.0-alpha1 ist experimentell und noch nicht unabhängig kryptografisch auditiert.</p></div></section><section id="selective"><h2>Selektiver Zugriff</h2><div class="code-block">rgx find project.rgx "report"<br>rgx cat project.rgx docs/report.txt<br>rgx extract project.rgx ./restore --path docs</div><p>Seekable Private- und Recipient-Streams erlauben List, Find, Cat, Verify und selektives Entpacken ohne vollständigen entschlüsselten temporären Innencontainer.</p></section><section id="benchmark"><h2>Benchmark</h2><p>Der eingebaute Benchmark vergleicht RGX mit ZIP/Deflate und optional einem installierten 7-Zip. Der aktuelle Recipient-Implementierungs-Snapshot ist separat dokumentiert.</p><div class="code-block">rgx benchmark ./project<br>rgx benchmark ./project --private</div></section><section id="automation"><h2>Automatisierung</h2><p>Passwörter werden nicht als Klartext-CLI-Argument akzeptiert. Für Private Mode, Passwort-Fallback und geschützte Identitäten stehen benannte Umgebungsvariablen zur Verfügung.</p><div class="code-block">RGX_PASSWORD='…' rgx pack ./project private.rgx --private --password-env RGX_PASSWORD<br>RGX_KEY_PASSWORD='…' rgx verify recipient.rgx --identity ~/.ssh/id_rgx</div></section></article>'''
          replace_content_layout('docs/index.html', docs_aside_de, docs_article_de)

          p = 'en/docs/index.html'
          text = load(p)
          text = text.replace('CLI, Private Mode, verification and benchmarking for the current RGX v0.4 alpha reference implementation.', 'CLI, Private Mode, Recipient Mode, RGX identities, signatures and benchmarking for the current RGX v0.5 alpha reference implementation.')
          save(p, text)
          docs_aside_en = '<aside class="content-toc"><strong>On this page</strong><a href="#start">Quick start</a><a href="#recipient">Recipient Mode</a><a href="#identities">Identities</a><a href="#signatures">Signatures</a><a href="#private">Private Mode</a><a href="#selective">Selective access</a><a href="#benchmark">Benchmark</a><a href="#automation">Automation</a></aside>'
          docs_article_en = '''<article class="prose"><section id="start"><h2>Quick start</h2><div class="code-block">rgx pack ./project project.rgx<br>rgx list project.rgx<br>rgx info project.rgx<br>rgx verify project.rgx<br>rgx extract project.rgx ./restore</div></section><section id="recipient"><h2>Recipient Mode</h2><p>Create a dedicated RGX identity and encrypt the archive for its public key. RGX does not reuse arbitrary SSH private keys; the default location only lives under <code>~/.ssh</code> for convenience.</p><div class="code-block">rgx keygen<br>rgx pack ./project project-recipient.rgx --recipient ~/.ssh/id_rgx.pub<br>rgx extract project-recipient.rgx ./restore</div><p>With the matching unprotected <code>~/.ssh/id_rgx</code>, RGX unlocks automatically without an archive password. Multiple <code>--recipient</code> arguments and <code>--password-fallback</code> are supported.</p></section><section id="identities"><h2>Protected identities</h2><div class="code-block">rgx keygen --protect</div><p>Protected private identity files use Argon2id + XChaCha20-Poly1305. The identity passphrase is separate from an optional archive password fallback.</p></section><section id="signatures"><h2>Detached Ed25519 signatures</h2><div class="code-block">rgx sign backup.rgx --identity ~/.ssh/id_rgx<br>rgx verify-signature backup.rgx backup.rgx.sig --public-key ~/.ssh/id_rgx.pub</div><p><code>rgx verify</code> checks archive structure and integrity. <code>verify-signature</code> additionally checks that the exact archive bytes were signed by the holder of the matching RGX private identity.</p></section><section id="private"><h2>Password Private Mode</h2><p><code>--private</code> remains available as the password-based mode.</p><div class="code-block">rgx pack ./project project-private.rgx --private</div><div class="content-card warning"><strong>Important</strong><p>v0.5.0-alpha1 is experimental and has not received an independent cryptographic audit.</p></div></section><section id="selective"><h2>Selective access</h2><div class="code-block">rgx find project.rgx "report"<br>rgx cat project.rgx docs/report.txt<br>rgx extract project.rgx ./restore --path docs</div><p>Seekable Private and Recipient streams support list, find, cat, verify and selective extraction without materializing a complete decrypted temporary inner archive.</p></section><section id="benchmark"><h2>Benchmark</h2><p>The built-in benchmark compares RGX with ZIP/Deflate and optionally an installed 7-Zip. The current Recipient implementation snapshot is documented separately.</p><div class="code-block">rgx benchmark ./project<br>rgx benchmark ./project --private</div></section><section id="automation"><h2>Automation</h2><p>Passwords are not accepted as plaintext CLI arguments. Named environment variables are available for Private Mode, password fallback and protected identities.</p><div class="code-block">RGX_PASSWORD='…' rgx pack ./project private.rgx --private --password-env RGX_PASSWORD<br>RGX_KEY_PASSWORD='…' rgx verify recipient.rgx --identity ~/.ssh/id_rgx</div></section></article>'''
          replace_content_layout('en/docs/index.html', docs_aside_en, docs_article_en)

          # Roadmap pages follow docs/ROADMAP.md from main.
          roadmap_aside_de = '<aside class="content-toc"><strong>Auf dieser Seite</strong><a href="#v01">v0.1 ✅</a><a href="#v02">v0.2 ✅</a><a href="#v03">v0.3 ✅</a><a href="#v04">v0.4 ✅</a><a href="#v05">v0.5 Alpha 🚧</a><a href="#v06">v0.6</a><a href="#v07">v0.7</a><a href="#future">Später</a></aside>'
          roadmap_article_de = '''<article class="prose"><section id="v01"><h2>v0.1 — Format foundation ✅</h2><ul><li>Custom RGX container</li><li>Zstandard + Store fallback</li><li>BLAKE3 Integrität</li><li>Pack / extract / list / info / verify</li></ul></section><section id="v02"><h2>v0.2 — Streaming, Chunking &amp; Deduplizierung ✅</h2><ul><li>Streaming source reads</li><li>Content-defined chunking</li><li>Archivweite BLAKE3 Chunk-IDs</li><li>Chunk-level Deduplizierung</li></ul></section><section id="v03"><h2>v0.3 — Private Archives &amp; Benchmarking ✅</h2><ul><li>Argon2id + XChaCha20-Poly1305</li><li>Verschlüsselte innere Metadaten</li><li>Wrong-password- und Tamper-Tests</li><li>ZIP/Deflate + optional 7-Zip Benchmark</li></ul></section><section id="v04"><h2>v0.4 — Private Hardening &amp; Selective Access ✅</h2><ul><li>Seekable encrypted I/O</li><li>Direktes Streaming in authentifizierte Frames</li><li>Random-Access-Entschlüsselung</li><li>find, cat und extract --path</li><li>Cross-platform CI, Audits und Parser-Fuzzing</li></ul></section><section id="v05"><h2>v0.5 — Recipient Identities &amp; Authenticity 🚧</h2><p>Die Kernfunktionen sind mit v0.5.0-alpha1 implementiert; Review und plattformgestützter Key-Schutz bleiben offen.</p><ul><li>X25519 RGX Recipient Identities ✅</li><li>Zufälliger 256-Bit-Archivschlüssel ✅</li><li>Bis zu 64 Recipient-Slots + optionaler Passwort-Fallback ✅</li><li>Native RGXR v2 + RGXK v1 Streams ✅</li><li>Automatische lokale Identity-Suche ✅</li><li>Optional geschützte private Identity-Dateien ✅</li><li>Detached Ed25519-Signaturen ✅</li><li>Recipient-Fuzzing und End-to-End-CLI-Tests ✅</li><li>Unabhängiges kryptografisches Review ⏳</li><li>Gehärtete Windows-ACLs / OS-Keychain / TPM / Hardware-Token ⏳</li></ul></section><section id="v06"><h2>v0.6 — Smartere Kompression</h2><ul><li>Adaptive Codec-Auswahl</li><li>Workload-aware Compression Profiles</li><li>Reproduzierbare Benchmark-Corpora</li><li>Persistierter Footer-/Index-Optimierung</li></ul></section><section id="v07"><h2>v0.7 — Snapshots &amp; Incremental Archives</h2><ul><li>Incremental Updates</li><li>Snapshot History</li><li>Delta-aware Storage</li><li>Archive Diff</li></ul></section><section id="future"><h2>Später</h2><ul><li>Recovery/Parity Blocks</li><li>Mountable Archives</li><li>GUI</li><li>Hardware-backed Identities</li><li>Weitere Plattformintegration</li><li>Langfristig stabile 1.0-Spezifikation</li></ul></section></article>'''
          replace_content_layout('roadmap/index.html', roadmap_aside_de, roadmap_article_de)

          roadmap_aside_en = '<aside class="content-toc"><strong>On this page</strong><a href="#v01">v0.1 ✅</a><a href="#v02">v0.2 ✅</a><a href="#v03">v0.3 ✅</a><a href="#v04">v0.4 ✅</a><a href="#v05">v0.5 Alpha 🚧</a><a href="#v06">v0.6</a><a href="#v07">v0.7</a><a href="#future">Later</a></aside>'
          roadmap_article_en = '''<article class="prose"><section id="v01"><h2>v0.1 — Format foundation ✅</h2><ul><li>Custom RGX container</li><li>Zstandard + store fallback</li><li>BLAKE3 integrity</li><li>Pack / extract / list / info / verify</li></ul></section><section id="v02"><h2>v0.2 — Streaming, chunking &amp; deduplication ✅</h2><ul><li>Streaming source reads</li><li>Content-defined chunking</li><li>Archive-wide BLAKE3 chunk IDs</li><li>Chunk-level deduplication</li></ul></section><section id="v03"><h2>v0.3 — Private archives &amp; benchmarking ✅</h2><ul><li>Argon2id + XChaCha20-Poly1305</li><li>Encrypted inner metadata</li><li>Wrong-password and tamper tests</li><li>ZIP/Deflate + optional 7-Zip benchmark</li></ul></section><section id="v04"><h2>v0.4 — Private hardening &amp; selective access ✅</h2><ul><li>Seekable encrypted I/O</li><li>Direct streaming into authenticated frames</li><li>Random-access decryption</li><li>find, cat and extract --path</li><li>Cross-platform CI, audits and parser fuzzing</li></ul></section><section id="v05"><h2>v0.5 — Recipient identities &amp; authenticity 🚧</h2><p>The core feature scope is implemented in v0.5.0-alpha1; review and platform-backed key protection remain open.</p><ul><li>X25519 RGX recipient identities ✅</li><li>Random 256-bit archive key ✅</li><li>Up to 64 recipient slots + optional password fallback ✅</li><li>Native RGXR v2 + RGXK v1 streams ✅</li><li>Automatic local identity lookup ✅</li><li>Optionally protected private identity files ✅</li><li>Detached Ed25519 signatures ✅</li><li>Recipient fuzzing and end-to-end CLI tests ✅</li><li>Independent cryptographic review ⏳</li><li>Hardened Windows ACLs / OS keychain / TPM / hardware token ⏳</li></ul></section><section id="v06"><h2>v0.6 — Smarter compression</h2><ul><li>Adaptive codec selection</li><li>Workload-aware compression profiles</li><li>Reproducible benchmark corpora</li><li>Persisted footer/index optimization</li></ul></section><section id="v07"><h2>v0.7 — Snapshots &amp; incremental archives</h2><ul><li>Incremental updates</li><li>Snapshot history</li><li>Delta-aware storage</li><li>Archive diff</li></ul></section><section id="future"><h2>Later</h2><ul><li>Recovery/parity blocks</li><li>Mountable archives</li><li>GUI</li><li>Hardware-backed identities</li><li>Additional platform integration</li><li>Long-term stable 1.0 specification</li></ul></section></article>'''
          replace_content_layout('en/roadmap/index.html', roadmap_aside_en, roadmap_article_en)

          # Refresh SEO descriptions left by old static pages where exact wording is known.
          for path in ['security/index.html', 'en/security/index.html']:
              text = load(path)
              text = text.replace('Threat Model, Kryptoprofil, Metadatenexposition und bekannte Grenzen von RGX v0.5.0-alpha1.', 'Threat Model, Recipient Mode, Identitäten, Signaturen und bekannte Grenzen von RGX v0.5.0-alpha1.')
              text = text.replace('Threat model, cryptographic profile, metadata exposure and known limitations of RGX v0.5.0-alpha1.', 'Threat model, Recipient Mode, identities, signatures and known limitations of RGX v0.5.0-alpha1.')
              save(path, text)

          # Keep sitemap freshness honest when present.
          sitemap = Path('sitemap.xml')
          if sitemap.exists():
              text = sitemap.read_text(encoding='utf-8')
              text = re.sub(r'<lastmod>[^<]+</lastmod>', '<lastmod>2026-09-09</lastmod>', text)
              sitemap.write_text(text, encoding='utf-8')

          # Static-site audit.
          html_files = list(Path('.').rglob('*.html'))
          stale = []
          for path in html_files:
              text = path.read_text(encoding='utf-8')
              if 'v0.4.0-alpha.2' in text:
                  stale.append(str(path))
          if stale:
              raise SystemExit('stale website version remains: ' + ', '.join(stale))

          required = {
              'index.html': ['v0.5.0-alpha1', 'X25519', 'Ed25519', 'RGXR / RGXE', 'RGX Recipient'],
              'en/index.html': ['v0.5.0-alpha1', 'X25519', 'Ed25519', 'RGXR / RGXE', 'RGX Recipient'],
              'security/index.html': ['RGXR v2 + RGXK v1', 'Ed25519', 'v0.5.0-alpha1'],
              'format/index.html': ['RGXR v2 + RGXK v1', 'RGX-SIGNATURE-1', 'v0.5.0-alpha1'],
              'docs/index.html': ['rgx keygen', 'verify-signature', 'v0.5.0-alpha1'],
              'roadmap/index.html': ['v0.5.0-alpha1', 'X25519', 'Ed25519'],
          }
          for path, needles in required.items():
              text = load(path)
              for needle in needles:
                  if needle not in text:
                      raise SystemExit(f'{path}: missing {needle}')

          print(f'Website synchronized to {VERSION}')
          PY

      - name: Validate repository and static site
        shell: bash
        run: |
          cargo fmt --all -- --check
          cargo test --locked --all-features
          git diff --check

      - name: Commit synchronized website
        shell: bash
        run: |
          git rm .github/workflows/sync-v05-website.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "website: update to v0.5.0-alpha1"
          git push origin HEAD:website
