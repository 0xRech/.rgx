[package]
name = "rgx"
version = "0.4.0-alpha.2"
edition = "2021"
rust-version = "1.88"
publish = false
description = "Reference implementation of the .rgx archive format"
license = "MIT"
repository = "https://github.com/0xRech/.rgx"
readme = "README.md"
keywords = ["archive", "compression", "privacy", "backup"]
categories = ["command-line-utilities", "compression"]

[[bin]]
name = "rgx"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
argon2 = "0.5"
blake3 = "1.5"
chacha20poly1305 = { version = "0.10", features = ["std"] }
clap = { version = "4.5", features = ["derive"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rpassword = "7.3"
tempfile = "3.12"
walkdir = "2.5"
zeroize = "1.8"
zip = "2.4"
zstd = "0.13"

[dev-dependencies]
tempfile = "3.12"
